<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#10221f">
        <title>Range field | ESP32-C6</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Ubuntu:wght@300;400&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/assets/base_style.css">
        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
                }
            }
        </script>
    </head>
    <body class="NoMargin">
        <div class="MainHeader">
            <a class="Title" href="/">
                <img src="/favicon.ico" alt="Einstellungen">
                <div class="Title">Lidar-Fill-State</div>
            </a>
            <div class="Spacer"></div>
            <a class="SettingsButton" href="/settings.html">
                <img class="Icon HoverEffect" src="/assets/cog_icon.svg" alt="Einstellungen">
            </a>
        </div>
        <div class="MainContent">
            <div class="StatsContainer">
                <div class="StatsBox">
                    <div class="Value">13,5 m³</div>
                    <div class="Subtext">Füllmasse</div>
                    <div class="Footer">
                        <div></div>
                        <div>Max: 15 m³</div>
                    </div>
                </div>
                <div class="StatsBox">Test</div>
                <div class="StatsBox">Bla</div>
            </div>
            <div class="ModelViewer">
                <canvas id="model-render" aria-label="3D-Modell"></canvas>
                <p id="model-status" class="ModelStatus" role="status">Lade 3D-Modell...</p>
            </div>
        </div>
        <script type="module">
            import * as THREE from "three";
            import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

            const canvas = document.getElementById("model-render");
            const viewer = canvas.parentElement;
            const status = document.getElementById("model-status");
            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 1000);
            let model;

            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            scene.add(new THREE.HemisphereLight(0xffffff, 0x58645e, 2));

            const keyLight = new THREE.DirectionalLight(0xffffff, 3);
            keyLight.position.set(4, 6, 5);
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0xffffff, 1.5);
            fillLight.position.set(-4, 2, -3);
            scene.add(fillLight);

            const resizeViewer = () => {
                const { width, height } = viewer.getBoundingClientRect();
                if (!width || !height) return;

                if (width <= 1920 && height <= 1080) {
                    renderer.setSize(width, height, false);
                }
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
            };

            new ResizeObserver(resizeViewer).observe(viewer);
            resizeViewer();

            new GLTFLoader().load(
                "/api/model3d",
                (gltf) => {
                    model = gltf.scene;
                    model.traverse((object) => {
                        if (!object.isMesh) return;

                        const materials = Array.isArray(object.material)
                            ? object.material
                            : [object.material];
                        for (const material of materials) {
                            material.side = THREE.FrontSide;
                            material.needsUpdate = true;
                        }
                    });

                    const bounds = new THREE.Box3().setFromObject(model);
                    const center = bounds.getCenter(new THREE.Vector3());
                    const size = bounds.getSize(new THREE.Vector3());
                    const radius = Math.max(size.length() / 2, 0.1);

                    model.position.sub(center);
                    scene.add(model);
                    camera.position.set(radius * 1.7, radius * 1.15, radius * 2.2);
                    camera.near = Math.max(radius / 1000, 0.001);
                    camera.far = radius * 20;
                    camera.lookAt(0, 0, 0);
                    camera.updateProjectionMatrix();
                    status.hidden = true;
                },
                (event) => {
                    if (event.lengthComputable) {
                        status.textContent = `Lade 3D-Modell... ${Math.round((event.loaded / event.total) * 100)}%`;
                    }
                },
                (error) => {
                    console.error("3D-Modell konnte nicht geladen werden:", error);
                    status.textContent = "3D-Modell konnte nicht geladen werden.";
                }
            );

            renderer.setAnimationLoop(() => {
                if (model) model.rotation.y += 0.002;
                renderer.render(scene, camera);
            });
        </script>
    </body>
</html>
