<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#10221f">
        <title>Range field | ESP32-C6</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Ubuntu:wght@300;400&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/assets/base_style.css">
        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
                    "three/addons/libs/stats.module.js": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/stats.module.js"
                }
            }
        </script>
        <script type="module" src="/index.js"></script>
    </head>
    <body class="NoMargin">
        <div class="MainHeader">
            <a class="Title" href="/">
                <img src="/favicon.ico" alt="Einstellungen">
                <div class="Text">Lidar-Fill-State</div>
            </a>
            <div class="Breadcrumb">Dashboard</div>
            <div class="Spacer"></div>
            <a class="SettingsButton" href="/settings">
                <img class="Icon HoverEffect" src="/assets/cog_icon.svg" alt="Einstellungen">
            </a>
        </div>
        <div class="MainContent">
            <div class="StatsContainer">
                <div class="StatsBox Volume">
                    <div class="CenterText">
                        <span class="Value">99</span>
                        <span> m³</span>
                    </div>
                    <div class="Subtext">Füllmasse</div>
                    <div class="Footer">
                        <div></div>
                        <div>
                            <span>Max:</span>
                            <span class="MaxValue">0</span>
                            <span> m³</span>
                        </div>
                    </div>
                </div>
                <div class="StatsBox">Test</div>
                <div class="StatsBox">Bla</div>
            </div>
            <div class="CanvasContainer">
                <canvas aria-label="3D-Modell"></canvas>
                <div class="Overlay Hide">
                    <div class="Spacer"></div>
                    <div class="ProgessContainer">
                        <progress class="load-process" min="0" max="100"></progress>
                        <p class="load-label" class="ModelStatus" role="status">
                            <span>3D-Model zu </span>
                            <span class="load-label-percent"></span>
                            <span>% geladen...</span>
                        </p>
                    </div>
                    <div class="Spacer"></div>
                </div>
            </div>
        </div>
    </body>
</html>
