<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/base_style.css">
    <title>Einstellungen</title>
</head>
<body>
    <h1>Einstellungen</h1>
    <form action="/settings" method="post" class="Thin Border">
        <label>
            <p>Wifi-Name</p>
            <div class="InputContainer">
                <input name="wifi_name" required type="text" />
            </div>
        </label>
        <label>
            <p>Wifi-Passwort</p>
            <div class="InputContainer">
                <input name="wifi_password" required type="password" />
            </div>
        </label>
        <input type="submit" value="Speichern" />
    </form>
    <form class="Thin Border">
        <label>
            <p>3D-Model</p>
            <div class="InputContainer">
                <input id="file" required name="3d_model" type="file" accept="model/gltf-binary" />
            </div>
        </label>
        <input type="submit" value="Speichern" />
    </form>

    <p id="status"></p>

    <a href="./file">
        <button>Download</button>
    </a>

    <script>
        async function upload() {
            const input = document.getElementById("file");
            const status = document.getElementById("status");

            if (!input.files.length) {
                status.textContent = "Bitte eine Datei auswählen.";
                return;
            }

            status.textContent = "Upload läuft...";

            const response = await fetch("/settings", {
                method: "POST",
                headers: {
                    "Content-Type": "application/octet-stream"
                },
                body: input.files[0],
            });

            status.textContent = await response.text();
        }
    </script>
</body>
</html>
