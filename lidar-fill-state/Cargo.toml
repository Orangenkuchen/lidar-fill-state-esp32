[package]
edition      = "2024"
name         = "lidar-fill-state"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "lidar-fill-state"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32c6", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6"] }

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }

embedded-io = "0.7.1"
embedded-io-async = "0.7.0"

esp-alloc = { version = "0.11.0", features = ["esp32c6"] }

embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5.0"

esp-radio = { version = "1.0.0-beta.1", features = [
  "esp-alloc",
  "esp32c6",
  "unstable",
  "wifi",
] }

smoltcp = { version = "0.14.0", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell = "2.1.1"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
